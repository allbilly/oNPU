[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onpu"
version = "0.1.0"
description = "A local model appliance for Rockchip boards, powered by tinygrad"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.50"]

[project.scripts]
onpu = "onpu.__main__:main"

[tool.setuptools]
packages = ["onpu", "onpu.static"]

[tool.setuptools.package-data]
onpu = ["static/*"]

[tool.setuptools.data-files]
"share/onpu" = ["THIRD_PARTY_NOTICES", "packaging/onpu.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
